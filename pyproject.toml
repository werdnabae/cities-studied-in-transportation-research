[project]
name = "cities-studied-in-transportation-research"
version = "0.1.0"
description = "City-level audit of which cities transportation research studies, and the gap between study geography and author geography."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew J. Bae" }]
keywords = ["bibliometrics", "geoparsing", "transport", "geography of knowledge"]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "rapidfuzz>=3.0",
    "unidecode>=1.3",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/werdnabae/cities-studied-in-transportation-research"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Compact, single-file analysis scripts intentionally use semicolon one-liners,
# guarded imports after `matplotlib.use`/`warnings.filterwarnings`, and tuple
# unpacking with unused fields; long data lines are fine.
ignore = ["E501", "E402", "E701", "E702", "E731", "B007"]
